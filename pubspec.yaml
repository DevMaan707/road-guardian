name: road_guardian_pro
description: "Road Guardian Pro - Real-time Driver Safety App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  flutter_animate: ^4.5.0
  google_fonts: ^6.2.1
  http: ^1.2.2
  onnxruntime: ^1.4.1
  geolocator: ^12.0.0
  permission_handler: ^11.3.1
  path_provider: ^2.1.5
  mapbox_maps_flutter: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/model/
    - assets/mappings/
